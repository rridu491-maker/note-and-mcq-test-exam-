<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<title>আমার পরীক্ষার প্রস্তুতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Baloo+Da+2:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--ink:#1e293b;--ink-soft:#64748b;--ink-mute:#94a3b8;--border:#e2e8f0;--card:#fff;--bg:#f5f7fb;--primary:#4f46e5;--primary-soft:#eef2ff;--primary-dark:#4338ca;--success:#16a34a;--success-soft:#f0fdf4;--danger:#dc2626;--danger-soft:#fef2f2;--warning:#d97706;--warning-soft:#fffbeb;--purple:#7c3aed;--purple-soft:#f3e8ff;--shadow-sm:0 1px 2px rgba(15,23,42,.05);--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);--shadow-lg:0 8px 30px rgba(15,23,42,.10);--font-main:'Hind Siliguri',sans-serif}
  html,body{margin:0;padding:0;min-height:100vh;font-family:var(--font-main);color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 0% 0%,#eef2ff 0%,transparent 45%),radial-gradient(circle at 100% 0%,#fdf2f8 0%,transparent 40%),linear-gradient(180deg,#f8fafc 0%,#f5f7fb 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased;transition:font-family .2s}
  #app{max-width:560px;margin:0 auto;padding:20px 16px 80px}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}

  /* ===== Header & Topbar ===== */
  .hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:4px 4px 22px}
  .hero h1{font-family:'Tiro Bangla',Georgia,serif;font-size:26px;font-weight:700;margin:0 0 6px;background:linear-gradient(135deg,#4f46e5,#7c3aed,#db2777);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .hero p{margin:0;color:var(--ink-soft);font-size:13.5px}
  .icon-btn-circle{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-sm);font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);transition:transform .1s}
  .icon-btn-circle:active{transform:scale(.93)}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .back-btn{background:var(--card);border:1px solid var(--border);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);flex-shrink:0}
  .back-btn:active{transform:scale(.95)}
  .page-title{font-size:18px;font-weight:700;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== Card ===== */
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid rgba(226,232,240,.6);transition:transform .15s ease,box-shadow .15s ease}
  .card.tappable{cursor:pointer}
  .card.tappable:active{transform:scale(.985);box-shadow:var(--shadow-sm)}
  .row{display:flex;align-items:center;gap:14px}
  .row-main{flex:1;min-width:0}
  .row-title{font-weight:700;font-size:15.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
  .row-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}

  /* ===== Menu button ===== */
  .menu-btn{width:36px;height:36px;border-radius:10px;background:transparent;border:none;color:var(--ink-mute);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-weight:700;transition:background .15s}
  .menu-btn:hover{background:#f1f5f9}
  .menu-btn:active{background:var(--primary-soft);transform:scale(.9)}

  /* ===== Badges ===== */
  .badge-num{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;box-shadow:0 4px 12px rgba(79,70,229,.25)}
  .badge-num.warn{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 12px rgba(217,119,6,.25)}
  .badge-num.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 12px rgba(220,38,38,.25)}
  .badge-num.trash{background:linear-gradient(135deg,#64748b,#475569);box-shadow:0 4px 12px rgba(71,85,105,.2)}
  .badge-num.photo{background:linear-gradient(135deg,#0891b2,#0e7490);box-shadow:0 4px 12px rgba(14,116,144,.25)}
  .badge-num.purple{background:linear-gradient(135deg,#7c3aed,#6d28d9);box-shadow:0 4px 12px rgba(124,58,237,.3)}

  /* ===== Chips ===== */
  .chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-left:6px}
  .chip.green{background:var(--success-soft);color:var(--success)}
  .chip.red{background:var(--danger-soft);color:var(--danger)}
  .chip.amber{background:var(--warning-soft);color:var(--warning)}
  .chip.purple{background:var(--purple-soft);color:var(--purple)}

  /* ===== Buttons ===== */
  .btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;text-align:center;margin-bottom:10px;transition:transform .1s ease,box-shadow .15s ease}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,var(--primary),#6366f1);color:#fff;box-shadow:0 6px 20px rgba(79,70,229,.30)}
  .btn-outline{background:var(--card);color:var(--primary);border:1.5px solid var(--primary);box-shadow:var(--shadow-sm)}
  .btn-quiet{background:var(--card);color:var(--ink-soft);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
  .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 6px 20px rgba(220,38,38,.25)}
  .btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 20px rgba(16,185,129,.25)}
  .btn-info{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;box-shadow:0 6px 20px rgba(14,116,144,.25)}
  .btn-mock{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 8px 24px rgba(217,119,6,.40);font-size:16.5px;padding:18px;letter-spacing:.3px}

  .section-label{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:22px 4px 10px}

  /* ===== Forms ===== */
  input[type=text],textarea{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14.5px;margin-bottom:10px;background:var(--card);color:var(--ink);transition:border-color .15s}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .opt-input-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .opt-input-row input[type=text]{margin-bottom:0}
  .opt-input-row input[type=radio]{accent-color:var(--primary);width:20px;height:20px;flex-shrink:0}
  .opt-letter{font-weight:700;width:18px;flex-shrink:0;color:var(--ink-soft);font-size:14px}

  /* ===== Quiz options ===== */
  .opt-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:10px;transition:all .15s ease}
  .opt-row:active:not(:disabled){transform:scale(.985)}
  .opt-row:disabled{cursor:default}
  .opt-bubble{width:34px;height:34px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;flex-shrink:0}
  .opt-row.correct{border-color:var(--success);background:var(--success-soft);color:#166534}
  .opt-row.correct .opt-bubble{background:var(--success);color:#fff}
  .opt-row.wrong{border-color:var(--danger);background:var(--danger-soft);color:#991b1b}
  .opt-row.wrong .opt-bubble{background:var(--danger);color:#fff}

  .q-progress{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;padding:0 4px}
  .q-progress .score-pill{background:var(--primary-soft);color:var(--primary);padding:3px 10px;border-radius:20px;font-weight:700}
  .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:22px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#7c3aed);border-radius:3px;transition:width .3s ease}
  .q-text{font-size:17.5px;font-weight:700;line-height:1.55;margin-bottom:20px;padding:0 4px}
  .q-text.q-complex{font-size:14.5px;font-weight:600;line-height:1.65;white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-left:3px solid var(--primary);padding:14px;border-radius:10px;overflow-x:auto}
  .q-text.q-complex::before{content:'📋 জটিল প্রশ্ন';display:block;font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .q-type-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--purple-soft);color:var(--purple);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}

  /* ===== Result ===== */
  .result-wrap{text-align:center;padding:20px 10px}
  .result-circle{width:140px;height:140px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,var(--primary),#7c3aed);box-shadow:0 12px 40px rgba(79,70,229,.30);color:#fff}
  .result-circle.good{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 12px 40px rgba(16,185,129,.30)}
  .result-circle.bad{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 12px 40px rgba(220,38,38,.30)}
  .result-circle .num{font-size:38px;font-weight:800;line-height:1}
  .result-circle .lbl{font-size:13px;opacity:.9;margin-top:6px}
  .result-title{font-size:20px;font-weight:700;margin:0 0 6px}
  .result-sub{color:var(--ink-soft);font-size:14px;margin-bottom:26px}

  /* ===== Empty & Banners ===== */
  .empty-state{text-align:center;color:var(--ink-mute);padding:40px 20px;font-size:14px;line-height:1.7}
  .empty-state .emoji{font-size:40px;display:block;margin-bottom:12px}
  .note-banner{background:var(--danger-soft);color:var(--danger);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;border:1px solid #fecaca}
  .info-banner{background:var(--primary-soft);color:var(--primary-dark);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;border:1px solid #c7d2fe;line-height:1.6}

  /* ===== QA list ===== */
  .qa-item{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:10px}
  .qa-header{display:flex;align-items:flex-start;gap:10px}
  .qa-q{flex:1;font-weight:700;font-size:14.5px;margin-bottom:10px;line-height:1.5}
  .qa-q.q-complex{font-weight:600;font-size:13px;white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:10px;border-radius:8px;overflow-x:auto}
  .qa-opt{font-size:13.5px;color:var(--ink-soft);padding:5px 0;display:flex;align-items:center;gap:8px}
  .qa-opt.is-correct{color:var(--success);font-weight:700}
  .qa-opt .letter{display:inline-flex;width:22px;height:22px;background:var(--primary-soft);color:var(--primary);border-radius:6px;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}
  .qa-opt.is-correct .letter{background:var(--success);color:#fff}

  /* ===== Trash ===== */
  .trash-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:10px}
  .trash-info{flex:1;min-width:0}
  .trash-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trash-meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
  .trash-actions{display:flex;gap:6px;flex-shrink:0}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
  .icon-btn.restore{background:var(--success-soft);color:var(--success)}
  .icon-btn.kill{background:var(--danger-soft);color:var(--danger)}

  /* ===== Bottom Sheet ===== */
  .sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(6px);animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:8px 0 env(safe-area-inset-bottom,12px);box-shadow:0 -10px 40px rgba(15,23,42,.2);animation:slideUp .28s cubic-bezier(.16,1,.3,1)}
  .sheet-handle{width:44px;height:5px;background:#cbd5e1;border-radius:3px;margin:8px auto 12px}
  .sheet-title{padding:6px 22px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
  .sheet-item{display:flex;align-items:center;gap:16px;padding:15px 22px;border:none;background:none;width:100%;text-align:left;font-size:15.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .12s}
  .sheet-item:active{background:#f1f5f9}
  .sheet-item .sicon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .sheet-item .sicon.blue{background:var(--primary-soft);color:var(--primary)}
  .sheet-item .sicon.green{background:var(--success-soft);color:var(--success)}
  .sheet-item .sicon.red{background:var(--danger-soft);color:var(--danger)}
  .sheet-item .sicon.amber{background:var(--warning-soft);color:var(--warning)}
  .sheet-item .sicon.purple{background:var(--purple-soft);color:var(--purple)}
  .sheet-item.danger{color:var(--danger)}
  .sheet-cancel{margin:8px 16px 0;padding:15px;background:#f1f5f9;border:none;border-radius:14px;font-size:15px;font-weight:700;color:var(--ink);width:calc(100% - 32px);cursor:pointer;font-family:inherit}

  /* ===== Modal ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:400;backdrop-filter:blur(6px);animation:fadeIn .18s ease}
  .modal{background:var(--card);border-radius:20px;padding:24px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);animation:scaleIn .22s cubic-bezier(.16,1,.3,1)}
  @keyframes scaleIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{margin:0 0 10px;font-size:17.5px;font-weight:700}
  .modal p{margin:0 0 18px;color:var(--ink-soft);font-size:14px;line-height:1.6}
  .modal input[type=text]{font-size:15.5px;padding:14px}
  .modal-btns{display:flex;gap:10px;margin-top:6px}
  .modal-btns .btn{flex:1;margin:0}

  /* ===== Media grid ===== */
  .media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .media-thumb{position:relative;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--border);cursor:pointer;aspect-ratio:3/4;box-shadow:var(--shadow-sm)}
  .media-thumb:active{transform:scale(.97)}
  .media-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .media-thumb .pdf-badge{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:6px;color:var(--danger);background:linear-gradient(135deg,#fef2f2,#fee2e2);font-weight:700;font-size:13px;padding:10px;text-align:center}
  .media-thumb .pdf-badge .icon{font-size:40px}
  .media-thumb .del-overlay{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:8px;border:none;background:rgba(220,38,38,.9);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .media-thumb .del-overlay:active{transform:scale(.9)}
  .add-media-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .add-media-row button{margin:0}
  .file-input-hidden{display:none}

  /* ===== Viewer ===== */
  .viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:500;display:flex;flex-direction:column}
  .viewer-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;flex-shrink:0;background:rgba(0,0,0,.3);z-index:10}
  .viewer-bar button{background:rgba(255,255,255,.18);border:none;color:#fff;width:42px;height:42px;border-radius:12px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .viewer-bar button:active{transform:scale(.92)}
  .viewer-bar .title{font-size:13.5px;opacity:.85;flex:1;text-align:center;margin:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewer-body{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  .viewer-img-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:center center;will-change:transform;pointer-events:none}
  .viewer-img-wrap img{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none;display:block}
  .viewer-controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,20,20,.85);padding:8px 10px;border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:10}
  .viewer-controls button{background:rgba(255,255,255,.12);border:none;color:#fff;width:44px;height:44px;border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
  .viewer-controls button:active{background:rgba(255,255,255,.3);transform:scale(.94)}
  .viewer-controls .zoom-level{color:#fff;font-size:13px;display:flex;align-items:center;padding:0 8px;font-weight:700;min-width:52px;justify-content:center}
  .viewer-hint{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.75);font-size:11.5px;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:20px;z-index:9;pointer-events:none;transition:opacity .3s;white-space:nowrap}

  /* ===== Settings ===== */
  .storage-info{background:var(--card);border-radius:14px;padding:16px;font-size:13px;line-height:1.8;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
  .storage-info b{color:var(--primary-dark)}
  .font-option{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);border-radius:14px;border:2px solid var(--border);margin-bottom:10px;cursor:pointer;transition:all .15s}
  .font-option:active{transform:scale(.98)}
  .font-option.selected{border-color:var(--primary);background:var(--primary-soft)}
  .font-option .sample{flex:1;font-size:17px;font-weight:600;color:var(--ink)}
  .font-option .fname{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .font-option .check{width:26px;height:26px;border-radius:50%;background:var(--border);color:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
  .font-option.selected .check{background:var(--primary);color:#fff}

  .mock-progress{background:var(--warning-soft);border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:13px;color:#92400e;line-height:1.7;margin-bottom:10px}
  .mock-progress b{color:#78350f}

  .type-toggle{display:flex;gap:8px;margin-bottom:12px}
  .type-toggle button{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-soft);transition:all .15s}
  .type-toggle button.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .type-toggle button.active.complex-toggle{background:var(--purple-soft);border-color:var(--purple);color:var(--purple)}

  .format-box{background:#fff;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;font-family:'Courier New',monospace;line-height:1.65;border:1px solid #e2e8f0;margin-top:8px;color:var(--ink);overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ========== CONSTANTS ========== */
const STORAGE_KEY = 'examStudyAppData_v2';
const TRASH_TTL_DAYS = 30;
const LETTERS = ['ক', 'খ', 'গ', 'ঘ'];
const MOCK_SIZE = 40;
const MOCK_COMPLEX_MIN = 10;
const OPFS_DIR = 'exam-media-v1';

/* ========== OPFS MEDIA ========== */
let mediaBackend = null;
async function getOpfsDir() {
  if (!navigator.storage || !navigator.storage.getDirectory) throw new Error('OPFS unsupported');
  const root = await navigator.storage.getDirectory();
  return await root.getDirectoryHandle(OPFS_DIR, { create: true });
}
async function opfsSave(id, blob) {
  const dir = await getOpfsDir();
  const fh = await dir.getFileHandle(id + '.bin', { create: true });
  const w = await fh.createWritable();
  await w.write(blob); await w.close();
}
async function opfsGet(id) {
  try { const dir = await getOpfsDir(); const fh = await dir.getFileHandle(id + '.bin'); return await fh.getFile(); }
  catch (e) { return null; }
}
async function opfsDelete(id) { try { const d = await getOpfsDir(); await d.removeEntry(id + '.bin'); } catch (e) {} }
async function opfsClear() { try { const r = await navigator.storage.getDirectory(); await r.removeEntry(OPFS_DIR, { recursive: true }); } catch (e) {} }
async function requestPersist() {
  if (!navigator.storage || !navigator.storage.persist) return false;
  try { if (await navigator.storage.persisted()) return true; return await navigator.storage.persist(); } catch (e) { return false; }
}
async function initMediaBackend() {
  if (mediaBackend) return mediaBackend;
  try { await getOpfsDir(); mediaBackend = 'opfs'; await requestPersist(); } catch (e) { mediaBackend = 'idb'; }
  return mediaBackend;
}
async function mediaSave(meta, blob) {
  const b = await initMediaBackend();
  if (b === 'opfs') return opfsSave(meta.id, blob);
  return idbSaveMedia({ ...meta, blob });
}
async function mediaDelete(id) {
  const b = await initMediaBackend();
  if (b === 'opfs') return opfsDelete(id);
  return idbDeleteMedia(id);
}
async function mediaGetByChapter(chapterId) {
  const b = await initMediaBackend();
  if (b === 'idb') return idbGetByChapter(chapterId);
  const metas = data.mediaMeta.filter(m => m.chapterId === chapterId);
  const out = [];
  for (const m of metas) { const f = await opfsGet(m.id); if (f) out.push({ ...m, blob: f }); }
  return out;
}
async function mediaGetAll() {
  const b = await initMediaBackend();
  if (b === 'idb') return idbGetAll();
  const out = [];
  for (const m of data.mediaMeta) { const f = await opfsGet(m.id); if (f) out.push({ ...m, blob: f }); }
  return out;
}
async function mediaClearAll() {
  const b = await initMediaBackend();
  if (b === 'opfs') return opfsClear();
  return idbClearAll();
}

/* ========== INDEXEDDB FALLBACK ========== */
let idbPromise = null;
function openIDB() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open('examPrepMediaDB', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('media')) {
          const store = db.createObjectStore('media', { keyPath: 'id' });
          store.createIndex('chapterId', 'chapterId', { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  });
  return idbPromise;
}
async function idbSaveMedia(item) {
  const db = await openIDB();
  return new Promise((res, rej) => { const tx = db.transaction('media', 'readwrite'); tx.objectStore('media').put(item); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function idbDeleteMedia(id) {
  const db = await openIDB();
  return new Promise((res, rej) => { const tx = db.transaction('media', 'readwrite'); tx.objectStore('media').delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function idbGetByChapter(chapterId) {
  const db = await openIDB();
  return new Promise((res, rej) => { const req = db.transaction('media', 'readonly').objectStore('media').index('chapterId').getAll(chapterId); req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error); });
}
async function idbGetAll() {
  const db = await openIDB();
  return new Promise((res, rej) => { const req = db.transaction('media', 'readonly').objectStore('media').getAll(); req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error); });
}
async function idbClearAll() {
  const db = await openIDB();
  return new Promise((res, rej) => { const tx = db.transaction('media', 'readwrite'); tx.objectStore('media').clear(); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}

function blobToBase64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
function base64ToBlob(dataUrl) { return fetch(dataUrl).then(r => r.blob()); }

/* ========== MAIN DATA ========== */
let memoryFallback = null;
function defaultData() {
  return {
    subjects: [
      { id: 'subj-1', name: 'বিষয় ১', chapters: [] },
      { id: 'subj-2', name: 'বিষয় ২', chapters: [] },
      { id: 'subj-3', name: 'বিষয় ৩', chapters: [] },
      { id: 'subj-4', name: 'বিষয় ৪', chapters: [] }
    ],
    wrongQuestions: [], trash: [], mediaMeta: [], mockProgress: {},
    settings: { font: 'hind' }
  };
}
function loadData() {
  if (memoryFallback) return memoryFallback;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    memoryFallback = raw ? JSON.parse(raw) : defaultData();
    if (!memoryFallback.wrongQuestions) memoryFallback.wrongQuestions = [];
    if (!memoryFallback.trash) memoryFallback.trash = [];
    if (!memoryFallback.mediaMeta) memoryFallback.mediaMeta = [];
    if (!memoryFallback.mockProgress) memoryFallback.mockProgress = {};
    if (!memoryFallback.settings) memoryFallback.settings = { font: 'hind' };
    memoryFallback.subjects.forEach(s => s.chapters.forEach(c => c.questions.forEach(q => {
      if (!q.type) q.type = (q.text && q.text.includes('\n')) ? 'complex' : 'mcq';
    })));
    purgeOldTrash();
  } catch (e) { memoryFallback = defaultData(); }
  return memoryFallback;
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(memoryFallback)); }
  catch (e) { console.warn('save failed:', e.message); }
}
function purgeOldTrash() {
  const now = Date.now();
  const ttl = TRASH_TTL_DAYS * 86400000;
  memoryFallback.trash = memoryFallback.trash.filter(item => (now - item.deletedAt) < ttl);
  saveData();
}
function applyFont() {
  const key = (data.settings && data.settings.font) || 'hind';
  const f = FONTS[key] || FONTS.hind;
  document.documentElement.style.setProperty('--font-main', f.stack);
  document.body.style.fontFamily = f.stack;
}

/* ========== HELPERS ========== */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function findSubject(id) { return data.subjects.find(s => s.id === id); }
function findChapter(subj, id) { return subj ? subj.chapters.find(c => c.id === id) : null; }
function findQuestion(subj, chapId, qid) {
  const c = findChapter(subj, chapId);
  return c ? c.questions.find(q => q.id === qid) : null;
}
function allQuestionsOfSubject(subj) {
  const qs = [];
  subj.chapters.forEach(ch => ch.questions.forEach(q => qs.push({ q, chapterId: ch.id, chapterName: ch.name })));
  return qs;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function escapeHtml(str) {
  const d = document.createElement('div');
  d.innerText = str == null ? '' : String(str);
  return d.innerHTML;
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' });
}
function getWrongForChapter(chapId) { return data.wrongQuestions.filter(w => w.chapterId === chapId); }
function fmtBytes(bytes) {
  if (!bytes) return '০ B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return bytes.toFixed(2) + ' ' + units[i];
}
function countComplexInChapter(c) { return c.questions.filter(q => q.type === 'complex').length; }
function countComplexInSubject(s) { return allQuestionsOfSubject(s).filter(x => x.q.type === 'complex').length; }

  }

}

/* ========== MOCK PROGRESS ========== */
function getMockProgress(subjectId) {
  if (!data.mockProgress) data.mockProgress = {};
  let prog = data.mockProgress[subjectId];
  if (!prog) prog = { usedIds: [], cycle: 1 };
  if (!prog.usedIds) prog.usedIds = [];
  if (!prog.cycle) prog.cycle = 1;
  return prog;
}
function setMockProgress(subjectId, prog) {
  if (!data.mockProgress) data.mockProgress = {};
  data.mockProgress[subjectId] = prog;
  saveData();
}

/* ========== BULK IMPORT ========== */
function parseBulkText(text) {
  const blocks = text.trim().split(/\n\s*\n/);
  const questions = [], errors = [];
  blocks.forEach((block, bi) => {
    const rawLines = block.split('\n').map(l => l.replace(/\s+$/, '')).filter(l => l.trim());
    if (rawLines.length === 0) return;
    const optRegex = /^\s*[\(\[]?\s*([কখগঘ]|[aAbBcCdD])\s*[\)\].:।]\s*/;
    const optIdx = [];
    rawLines.forEach((l, i) => { if (optRegex.test(l)) optIdx.push(i); });
    if (optIdx.length < 4) { errors.push(`ব্লক ${bi + 1}: ৪টি অপশন নেই`); return; }
    const last4 = optIdx.slice(-4);
    for (let i = 1; i < 4; i++) if (last4[i] !== last4[i-1] + 1) { errors.push(`ব্লক ${bi + 1}: অপশন পরপর নয়`); return; }
    if (last4[3] !== rawLines.length - 1) { errors.push(`ব্লক ${bi + 1}: অপশনের পরে অতিরিক্ত লাইন`); return; }
    const optLines = last4.map(i => rawLines[i]);
    let qLines = rawLines.slice(0, last4[0]);
    const aIdx = qLines.findIndex(l => /^\s*(উত্তর|answer)\s*[:：]/i.test(l));
    let aLine = '';
    if (aIdx !== -1) { aLine = qLines[aIdx]; qLines.splice(aIdx, 1); }
    if (qLines.length === 0) { errors.push(`ব্লক ${bi + 1}: প্রশ্নের বডি নেই`); return; }
    let qText = qLines.join('\n').trim().replace(/^প্রশ্ন\s*[:：]?\s*/, '');
    const options = optLines.map(l => l.replace(optRegex, '').trim());
    let correct = -1;
    optLines.forEach((l, i) => {
      if (l.includes('*')) { if (correct === -1) correct = i; options[i] = options[i].replace(/\*/g, '').trim(); }
    });
    if (correct === -1 && aLine) {
      const ans = aLine.replace(/^\s*(উত্তর|answer)\s*[:：]\s*/i, '').trim();
      const lm = { 'ক': 0, 'খ': 1, 'গ': 2, 'ঘ': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3, 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
      const letter = ans.charAt(0);
      if (lm[letter] !== undefined) correct = lm[letter];
      else if (/^[1-4]/.test(ans)) correct = parseInt(ans) - 1;
      else { const idx = options.findIndex(o => o.toLowerCase() === ans.toLowerCase()); if (idx !== -1) correct = idx; }
    }
    if (correct === -1 || correct > 3) { errors.push(`ব্লক ${bi + 1}: সঠিক উত্তর নেই`); return; }
    const type = qLines.length > 1 ? 'complex' : 'mcq';
    questions.push({ id: uid(), type, text: qText, options, correct });
  });
  return { questions, errors };
}

      q.options.forEach((opt, oi) => {

  return html;

async function handleMediaUpload(event, type) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    await initMediaBackend();

    if (type === 'image') {
      try { blob = await compressImage(file, 1600, 0.85); } catch (e) { blob = file; }
    }
    const id = uid();
    const meta = { id, chapterId: state.chapterId, type, name: file.name || (type === 'image' ? 'ছবি' : 'PDF'), createdAt: Date.now() };
    await mediaSave(meta, blob);

    event.target.value = '';

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxWidth) { height = Math.round(height * maxWidth / width); width = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('compress fail')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img read fail')); };
    img.src = url;
  });
}

function updateViewerTransform() {
  const m = state.mediaViewer; if (!m) return;
  const wrap = document.getElementById('viewerImgWrap'); if (!wrap) return;
  wrap.style.transform = `translate(${m.tx || 0}px, ${m.ty || 0}px) scale(${m.scale || 1}) rotate(${m.rotation || 0}deg)`;

}
function zoomIn() { if (!state.mediaViewer) return; state.mediaViewer.scale = Math.min(6, (state.mediaViewer.scale || 1) * 1.5); updateViewerTransform(); }
function zoomOut() { if (!state.mediaViewer) return; state.mediaViewer.scale = Math.max(0.4, (state.mediaViewer.scale || 1) / 1.5); updateViewerTransform(); }
function rotateViewer() { if (!state.mediaViewer) return; state.mediaViewer.rotation = ((state.mediaViewer.rotation || 0) + 90) % 360; updateViewerTransform(); }
function resetViewer() { if (!state.mediaViewer) return; state.mediaViewer.scale = 1; state.mediaViewer.tx = 0; state.mediaViewer.ty = 0; state.mediaViewer.rotation = 0; updateViewerTransform(); }

function bindViewer() {
  const body = document.getElementById('viewerBody');
  if (!body || !state.mediaViewer) return;
  const hint = document.getElementById('viewerHint');
  let startDist = 0, startScale = 1, startX = 0, startY = 0, startTx = 0, startTy = 0;
  let dragging = false, pinching = false, lastTap = 0, hintHidden = false;
  let mouseDown = false, mStartX = 0, mStartY = 0, mStartTx = 0, mStartTy = 0;
  function hideHint() { if (hint && !hintHidden) { hintHidden = true; hint.style.opacity = '0'; setTimeout(() => hint && hint.remove(), 400); } }
  function getDist(t1, t2) { return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY); }

  body.addEventListener('touchstart', (e) => {
    hideHint();
    if (e.touches.length === 2) {
      pinching = true; dragging = false;
      startDist = getDist(e.touches[0], e.touches[1]);
      startScale = state.mediaViewer.scale || 1;
    } else if (e.touches.length === 1) {
      pinching = false; dragging = true;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startTx = state.mediaViewer.tx || 0; startTy = state.mediaViewer.ty || 0;
      const now = Date.now();
      if (now - lastTap < 300) {
        if ((state.mediaViewer.scale || 1) > 1.1) { state.mediaViewer.scale = 1; state.mediaViewer.tx = 0; state.mediaViewer.ty = 0; }
        else { state.mediaViewer.scale = 2.5; }
        updateViewerTransform(); dragging = false;
      }
      lastTap = now;
    }
  }, { passive: true });

  body.addEventListener('touchmove', (e) => {
    if (!state.mediaViewer) return;
    if (pinching && e.touches.length === 2) {
      e.preventDefault();
      const ratio = getDist(e.touches[0], e.touches[1]) / startDist;
      state.mediaViewer.scale = Math.max(0.4, Math.min(6, startScale * ratio));
      updateViewerTransform();
    } else if (dragging && e.touches.length === 1) {
      e.preventDefault();
      state.mediaViewer.tx = startTx + (e.touches[0].clientX - startX);
      state.mediaViewer.ty = startTy + (e.touches[0].clientY - startY);
      updateViewerTransform();
    }
  }, { passive: false });

  body.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) { pinching = false; dragging = false; }
    else if (e.touches.length === 1) {
      pinching = false; dragging = true;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startTx = state.mediaViewer.tx || 0; startTy = state.mediaViewer.ty || 0;
    }
  }, { passive: true });

  body.addEventListener('wheel', (e) => {
    if (!state.mediaViewer) return;
    e.preventDefault(); hideHint();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    state.mediaViewer.scale = Math.max(0.4, Math.min(6, (state.mediaViewer.scale || 1) * factor));
    updateViewerTransform();
  }, { passive: false });

  body.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    hideHint(); mouseDown = true;
    mStartX = e.clientX; mStartY = e.clientY;
    mStartTx = state.mediaViewer.tx || 0; mStartTy = state.mediaViewer.ty || 0;
  });
  window.addEventListener('mousemove', (e) => {
    if (!mouseDown || !state.mediaViewer) return;
    state.mediaViewer.tx = mStartTx + (e.clientX - mStartX);
    state.mediaViewer.ty = mStartTy + (e.clientY - mStartY);
    updateViewerTransform();
  });
  window.addEventListener('mouseup', () => { mouseDown = false; });
}

/* ========== QUIZ ========== */
function startChapterPractice() {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  state.quizQuestions = shuffle(c.questions);
  state.quizIndex = 0; state.quizScore = 0; state.quizAnswered = null; state.quizWrongIds = [];
  state.mode = 'chapter';
  goto('quiz');
}

function startFullMockTest() {
  const s = findSubject(state.subjectId);
  const all = allQuestionsOfSubject(s).map(x => x.q);
  if (all.length === 0) return;
  const target = Math.min(MOCK_SIZE, all.length);
  let prog = getMockProgress(s.id);
  const usedSet = new Set(prog.usedIds);
  const freshAll = all.filter(q => !usedSet.has(q.id));
  const freshComplex = freshAll.filter(q => q.type === 'complex');
  const freshMcq = freshAll.filter(q => q.type !== 'complex');
  const availableComplex = all.filter(q => q.type === 'complex').length;
  const desiredComplex = Math.min(MOCK_COMPLEX_MIN, availableComplex, target);

  let selected = [], newUsedIds = [...prog.usedIds];
  let pickedComplex = shuffle(freshComplex).slice(0, desiredComplex);
  let pickedMcq = shuffle(freshMcq).slice(0, target - pickedComplex.length);

  if (pickedMcq.length < target - pickedComplex.length) {
    const extra = shuffle(freshComplex.filter(q => !pickedComplex.includes(q))).slice(0, (target - pickedComplex.length) - pickedMcq.length);
    pickedComplex = pickedComplex.concat(extra);
  }

  if (pickedComplex.length + pickedMcq.length < target) {
    prog.cycle++;
    const pickedIds = new Set([...pickedComplex, ...pickedMcq].map(q => q.id));
    const remaining = target - (pickedComplex.length + pickedMcq.length);
    const complexPool = all.filter(q => q.type === 'complex' && !pickedIds.has(q.id));
    const moreComplex = shuffle(complexPool).slice(0, Math.max(0, Math.min(remaining, desiredComplex - pickedComplex.length)));
    moreComplex.forEach(q => pickedIds.add(q.id));
    pickedComplex = pickedComplex.concat(moreComplex);
    const stillNeeded = target - (pickedComplex.length + pickedMcq.length);
    const restPool = all.filter(q => !pickedIds.has(q.id));
    const rest = shuffle(restPool).slice(0, stillNeeded);
    pickedMcq = pickedMcq.concat(rest);
    selected = shuffle([...pickedComplex, ...pickedMcq]);
    newUsedIds = selected.map(q => q.id);
  } else {
    selected = shuffle([...pickedComplex, ...pickedMcq]);
    selected.forEach(q => newUsedIds.push(q.id));
  }

  prog.usedIds = newUsedIds;
  setMockProgress(s.id, prog);

  state.quizQuestions = selected;
  state.quizIndex = 0; state.quizScore = 0; state.quizAnswered = null; state.quizWrongIds = [];
  state.mode = 'final';
  goto('quiz');
}

function startChapterWrongPractice() {
  const wrongs = getWrongForChapter(state.chapterId);
  if (wrongs.length === 0) return;
  state.quizQuestions = shuffle(wrongs.map(w => w.question));
  state.quizIndex = 0; state.quizScore = 0; state.quizAnswered = null; state.quizWrongIds = [];
  state.mode = 'chapterWrong';
  goto('quiz');
}

function renderQuiz() {
  const qs = state.quizQuestions;
  if (!qs || qs.length === 0) { goto('home'); return ''; }
  const idx = state.quizIndex;
  const q = qs[idx];
  const pct = Math.round((idx / qs.length) * 100);
  const titleMap = { final: 'ফুল মক টেস্ট', chapterWrong: 'ভুল প্রশ্ন প্র্যাকটিস', chapter: 'প্র্যাকটিস' };
  const backMap = { final: 'subject', chapterWrong: 'chapterWrong', chapter: 'chapter' };
  let html = topbar(titleMap[state.mode] || 'প্রশ্ন', backMap[state.mode] || 'chapter');

  html += `<div class="q-progress">
    <span>প্রশ্ন ${idx + 1} / ${qs.length}</span>
    <span class="score-pill">স্কোর ${state.quizScore}</span>
  </div>`;
  html += `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  if (q.type === 'complex') html += `<div class="q-type-badge">📋 জটিল প্রশ্ন</div>`;
  html += `<div class="q-text${q.type === 'complex' ? ' q-complex' : ''}">${escapeHtml(q.text)}</div>`;

  q.options.forEach((opt, oi) => {
    let cls = 'opt-row';
    if (state.quizAnswered !== null) {
      if (oi === q.correct) cls += ' correct';
      else if (oi === state.quizAnswered) cls += ' wrong';
    }
    html += `<button class="${cls}" ${state.quizAnswered !== null ? 'disabled' : `onclick="answerQuiz(${oi})"`}>
      <span class="opt-bubble">${LETTERS[oi]}</span>
      <span>${escapeHtml(opt)}</span>
    </button>`;
  });

  if (state.quizAnswered !== null) {
    html += `<button class="btn btn-primary" style="margin-top:16px;" onclick="nextQuiz()">
      ${idx + 1 < qs.length ? 'পরবর্তী প্রশ্ন →' : 'ফলাফল দেখুন'}
    </button>`;
  }

}

function answerQuiz(oi) {
  if (state.quizAnswered !== null) return;
  state.quizAnswered = oi;
  const q = state.quizQuestions[state.quizIndex];
  if (oi === q.correct) {
    state.quizScore++;
    if (state.mode === 'chapterWrong') {
      data.wrongQuestions = data.wrongQuestions.filter(w => w.question.id !== q.id);
      saveData();
    }
  } else {
    state.quizWrongIds.push(q.id);
    addToWrongList(q);
  }
  render();
}
function addToWrongList(q) {
  let subjId = '', subjName = '', chapId = '', chapName = '';
  for (const s of data.subjects) {
    for (const c of s.chapters) {
      if (c.questions.some(cq => cq.id === q.id)) { subjId = s.id; subjName = s.name; chapId = c.id; chapName = c.name; break; }
    }
    if (subjId) break;
  }
  const existing = data.wrongQuestions.find(w => w.question.id === q.id);
  if (existing) {
    existing.wrongCount = (existing.wrongCount || 1) + 1;
    existing.lastWrong = Date.now();
  } else {
    data.wrongQuestions.push({ question: q, subjectId: subjId, subjectName: subjName, chapterId: chapId, chapterName: chapName, wrongCount: 1, lastWrong: Date.now() });
  }
  saveData();
}
function nextQuiz() {
  state.quizIndex++;
  state.quizAnswered = null;
  if (state.quizIndex >= state.quizQuestions.length) goto('result');
  else render();
}

    let name = t.type === 'subject' ? t.data.name : t.type === 'chapter' ? t.data.name : t.data.text;
    if (name.length > 50) name = name.slice(0, 50) + '...';
    html += `<div class="trash-item">
      <div class="trash-info">
        <div class="trash-name">${escapeHtml(name)}</div>
        <div class="trash-meta">${typeLabel} · ${fmtDate(t.deletedAt)} · ${daysLeft} দিন বাকি</div>
      </div>
      <div class="trash-actions">
        <button class="icon-btn restore" onclick="restoreFromTrash('${t.id}')">↩️</button>
        <button class="icon-btn kill" onclick="killTrashItem('${t.id}')">✕</button>
      </div>
    </div>`;
  });
  return html;
}
function restoreFromTrash(tid) {
  const item = data.trash.find(t => t.id === tid);
  if (!item) return;
  if (item.type === 'subject') data.subjects.push(item.data);
  else if (item.type === 'chapter') {
    const subj = findSubject(item.parentId);
    if (!subj) { alert('মূল সাবজেক্ট পাওয়া যাচ্ছে না।'); return; }
    subj.chapters.push(item.data);
  } else if (item.type === 'question') {
    const subj = findSubject(item.subjectId);
    const chap = findChapter(subj, item.chapterId);
    if (!chap) { alert('মূল অধ্যায় পাওয়া যাচ্ছে না।'); return; }
    chap.questions.push(item.data);
  }
  data.trash = data.trash.filter(t => t.id !== tid);
  saveData(); render();
}
function killTrashItem(tid) { data.trash = data.trash.filter(t => t.id !== tid); saveData(); render(); }

/* ========== SETTINGS ========== */
function renderSettings() {
  let html = topbar('সেটিংস', 'home');

  // Font
  html += `<div class="section-label">🔤 ফন্ট স্টাইল</div>`;
  Object.keys(FONTS).forEach(key => {
    const f = FONTS[key];
    const selected = ((data.settings && data.settings.font) || 'hind') === key;
    html += `<div class="font-option ${selected ? 'selected' : ''}" onclick="setFont('${key}')">
      <div class="sample">
        <div class="fname" style="font-family:'Hind Siliguri',sans-serif;">${f.label}</div>
        <div style="font-family:${f.stack};">আমার পরীক্ষার প্রস্তুতি</div>
        <div style="font-family:${f.stack};font-size:12px;color:var(--ink-soft);margin-top:2px;">বাংলাদেশ স্বাধীন হয় ১৯৭১ সালে</div>
      </div>
      <div class="check">✓</div>
    </div>`;
  });

  // Storage info
  html += `<div class="section-label">📊 স্টোরেজ তথ্য</div>`;
  html += `<div class="storage-info">
    <b>মোট ছবি/PDF:</b> ${data.mediaMeta.length} টি<br>
    <span id="storageEstimate">⏳ লোড হচ্ছে...</span>
  </div>`;

  // Backup section
  html += `<div class="section-label">💾 ব্যাকআপ</div>`;
  html += `<button class="btn btn-primary" onclick="exportBackup()">⬇️ ব্যাকআপ ডাউনলোড করুন</button>`;
  html += `<div class="row-sub" style="margin:-4px 4px 12px;">ফাইলটি Google Drive বা WhatsApp-এ সেভ রাখুন।</div>`;
  html += `<input type="file" id="importFile" accept=".json" style="width:100%;padding:12px;border:1.5px dashed var(--border);border-radius:12px;margin-bottom:10px;background:var(--card);">`;
  html += `<button class="btn btn-success" onclick="importBackup()">⬆️ ব্যাকআপ থেকে রিস্টোর করুন</button>`;
  html += `<div class="row-sub" style="margin:-4px 4px 20px;">⚠️ বর্তমান সব ডেটা প্রতিস্থাপিত হবে।</div>`;

  // App info
  html += `<div class="section-label">ℹ️ অ্যাপ তথ্য</div>`;
  const totalSubjects = data.subjects.length;
  const totalChapters = data.subjects.reduce((a, s) => a + s.chapters.length, 0);
  const totalQ = data.subjects.reduce((a, s) => a + allQuestionsOfSubject(s).length, 0);
  const totalComplex = data.subjects.reduce((a, s) => a + countComplexInSubject(s), 0);
  const totalWrong = data.wrongQuestions.length;
  html += `<div class="storage-info">
    <b>সাবজেক্ট:</b> ${totalSubjects}<br>
    <b>মোট অধ্যায়:</b> ${totalChapters}<br>
    <b>মোট প্রশ্ন:</b> ${totalQ} (${totalComplex} জটিল)<br>
    <b>ভুল প্রশ্ন:</b> ${totalWrong}<br>
    <b>রিসাইকেল বিনে:</b> ${data.trash.length}
  </div>`;

  // Danger
  html += `<div class="section-label">⚠️ বিপজ্জনক এলাকা</div>`;
  html += `<button class="btn btn-danger" onclick="askResetAll()">🔄 সবকিছু রিসেট করুন</button>`;
  html += `<div class="row-sub" style="margin:-4px 4px;">সব প্রশ্ন, ছবি, নোট, সেটিংস — সব মুছে যাবে।</div>`;

  setTimeout(loadStorageInfo, 80);
  return html;
}

function setFont(key) {
  if (!FONTS[key]) return;
  data.settings = data.settings || {};
  data.settings.font = key;
  saveData();
  applyFont();
  render();
}

async function loadStorageInfo() {
  const el = document.getElementById('storageEstimate');
  if (!el) return;
  try {
    let backendLabel = 'IndexedDB';
    try { const b = await initMediaBackend(); backendLabel = b === 'opfs' ? 'OPFS (উন্নত)' : 'IndexedDB'; } catch (e) {}
    let txt = `<b>স্টোরেজ পদ্ধতি:</b> ${backendLabel}<br>`;
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      const used = fmtBytes(est.usage), quota = fmtBytes(est.quota);
      const pct = est.quota ? ((est.usage / est.quota) * 100).toFixed(1) : 0;
      txt += `<b>ব্যবহৃত:</b> ${used} / <b>ফোনের অনুমতি:</b> ${quota} (${pct}%)`;
    } else { txt += 'সীমা তথ্য পাওয়া যায়নি।'; }
    el.innerHTML = txt;
  } catch (e) { el.innerHTML = 'তথ্য লোড করা যায়নি।'; }
}

/* ========== BACKUP FUNCTIONS ========== */
async function exportBackup() {
  try {
    alert('⏳ ব্যাকআপ তৈরি হচ্ছে... ছবি অনেক থাকলে কিছু সময় লাগবে।');
    const allMedia = await mediaGetAll();
    const mediaData = [];
    for (const m of allMedia) {
      if (!m.blob) continue;
      const base64 = await blobToBase64(m.blob);
      mediaData.push({ id: m.id, chapterId: m.chapterId, type: m.type, name: m.name, createdAt: m.createdAt, data: base64 });
    }
    const backup = {
      subjects: data.subjects, wrongQuestions: data.wrongQuestions, trash: data.trash,
      mediaMeta: data.mediaMeta, mockProgress: data.mockProgress || {},
      settings: data.settings || { font: 'hind' },
      media: mediaData, exportedAt: Date.now()
    };
    const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = `exam-prep-backup-${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) { alert('❌ ব্যাকআপ তৈরি ব্যর্থ: ' + e.message); }
}

function importBackup() {
  const fileInput = document.getElementById('importFile');
  const file = fileInput.files[0];
  if (!file) { alert('প্রথমে ফাইল নির্বাচন করুন।'); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.subjects || !Array.isArray(parsed.subjects)) throw new Error('ভুল ফাইল');
      if (!confirm('বর্তমান সব ডেটা প্রতিস্থাপিত হবে। নিশ্চিত?')) return;
      alert('⏳ রিস্টোর হচ্ছে...');
      await mediaClearAll();
      if (parsed.media && Array.isArray(parsed.media)) {
        for (const m of parsed.media) {
          if (!m.data) continue;
          const blob = await base64ToBlob(m.data);
          await mediaSave({ id: m.id, chapterId: m.chapterId, type: m.type, name: m.name, createdAt: m.createdAt || Date.now() }, blob);
        }
      }
      parsed.subjects.forEach(s => s.chapters.forEach(c => c.questions.forEach(q => {
        if (!q.type) q.type = (q.text && q.text.includes('\n')) ? 'complex' : 'mcq';
      })));
      data = {
        subjects: parsed.subjects, wrongQuestions: parsed.wrongQuestions || [], trash: parsed.trash || [],
        mediaMeta: parsed.mediaMeta || [], mockProgress: parsed.mockProgress || {},
        settings: parsed.settings || { font: 'hind' }
      };
      memoryFallback = data;
      saveData();
      applyFont();
      alert('✅ সফলভাবে রিস্টোর হয়েছে।');
      goto('home');
    } catch (err) { alert('❌ রিস্টোর ব্যর্থ: ' + err.message); }
  };
  reader.readAsText(file);
}

/* ========== BOTTOM SHEET ========== */
function renderSheet() {
  const s = state.sheet;
  let html = `<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${s.title || 'মেনু'}</div>
      ${s.items.map(it => `<button class="sheet-item ${it.danger ? 'danger' : ''}" onclick="${it.action}">
        <span class="sicon ${it.color || 'blue'}">${it.icon}</span>
        <span>${it.label}</span>
      </button>`).join('')}
      <button class="sheet-cancel" onclick="closeSheet()">বাতিল</button>
    </div>
  </div>`;
  return html;
}
function closeSheet() { state.sheet = null; render(); }

/* ========== MODALS ========== */
function renderModal() {
  const m = state.modal;
  if (m.type === 'prompt') {
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${m.title}</h3>
        ${m.body ? `<p>${m.body}</p>` : ''}
        <input type="text" id="promptInput" value="${escapeHtml(m.value || '')}" placeholder="${escapeHtml(m.placeholder || '')}" autofocus>
        <div class="modal-btns">
          <button class="btn btn-quiet" onclick="closeModal()">বাতিল</button>
          <button class="btn btn-primary" onclick="submitPrompt()">${m.okText || 'সংরক্ষণ'}</button>
        </div>
      </div>
    </div>`;
  }
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>${m.title}</h3>
      <p>${m.body}</p>
      <div class="modal-btns">
        <button class="btn btn-quiet" onclick="closeModal()">বাতিল</button>
        <button class="btn ${m.danger ? 'btn-danger' : 'btn-primary'}" onclick="${m.onOk}">${m.okText}</button>
      </div>
    </div>
  </div>`;
}

function closeModal() { state.modal = null; render(); }
function showModal(title, body, okText, onOk, danger) {
  state.modal = { type: 'confirm', title, body, okText, onOk, danger };
  render();
}
function showPrompt(title, body, value, placeholder, okText, onSave) {
  state.modal = { type: 'prompt', title, body, value, placeholder, okText, onSave };
  render();
  setTimeout(() => { const el = document.getElementById('promptInput'); if (el) { el.focus(); el.select(); } }, 100);
}
function submitPrompt() {
  const input = document.getElementById('promptInput');
  if (!input) return;
  const val = input.value.trim();
  const cb = state.modal && state.modal.onSave;
  if (cb) cb(val);
}

/* ========== DELETE ACTIONS ========== */
function askDeleteSubject(id) {
  state.sheet = null;
  const s = findSubject(id);
  showModal('সাবজেক্ট মুছবেন?', `"${escapeHtml(s.name)}" ও সব অধ্যায়, প্রশ্ন, ছবি ৩০ দিনের বিনে যাবে।`, 'মুছে ফেলুন', `reallyDeleteSubject('${id}')`, true);
}
async function reallyDeleteSubject(id) {
  const s = findSubject(id);
  for (const c of s.chapters) {
    const ml = data.mediaMeta.filter(m => m.chapterId === c.id);
    for (const m of ml) { try { await mediaDelete(m.id); } catch (e) {} }
  }
  data.mediaMeta = data.mediaMeta.filter(m => !s.chapters.some(c => c.id === m.chapterId));
  data.trash.push({ id: uid(), type: 'subject', data: s, deletedAt: Date.now() });
  data.subjects = data.subjects.filter(x => x.id !== id);
  if (data.mockProgress) delete data.mockProgress[id];
  closeModal(); saveData(); render();
}

function askDeleteChapter(id) {
  state.sheet = null;
  const s = findSubject(state.subjectId);
  const c = findChapter(s, id);
  showModal('অধ্যায় মুছবেন?', `"${escapeHtml(c.name)}" ও এর সব প্রশ্ন ও ছবি ৩০ দিনের বিনে যাবে।`, 'মুছে ফেলুন', `reallyDeleteChapter('${id}')`, true);
}
async function reallyDeleteChapter(id) {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, id);
  const ml = data.mediaMeta.filter(m => m.chapterId === id);
  for (const m of ml) { try { await mediaDelete(m.id); } catch (e) {} }
  data.mediaMeta = data.mediaMeta.filter(m => m.chapterId !== id);
  data.trash.push({ id: uid(), type: 'chapter', data: c, parentId: s.id, deletedAt: Date.now() });
  s.chapters = s.chapters.filter(x => x.id !== id);
  if (data.mockProgress) delete data.mockProgress[s.id];
  closeModal(); saveData(); render();
}

function askDeleteQuestion(qid) {
  state.sheet = null;
  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  const q = c.questions.find(x => x.id === qid);
  showModal('প্রশ্ন মুছবেন?', `"${escapeHtml(q.text.slice(0, 60))}..." ৩০ দিনের বিনে যাবে।`, 'মুছে ফেলুন', `reallyDeleteQuestion('${qid}')`, true);
}
function reallyDeleteQuestion(qid) {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  const q = c.questions.find(x => x.id === qid);
  data.trash.push({ id: uid(), type: 'question', data: q, subjectId: s.id, chapterId: c.id, deletedAt: Date.now() });
  c.questions = c.questions.filter(x => x.id !== qid);
  data.wrongQuestions = data.wrongQuestions.filter(w => w.question.id !== qid);
  if (data.mockProgress) delete data.mockProgress[s.id];
  closeModal(); saveData(); render();
}

function askEmptyTrash() {
  showModal('বিন খালি করবেন?', 'সব স্থায়ীভাবে মুছে যাবে।', 'স্থায়ীভাবে মুছুন', 'reallyEmptyTrash()', true);
}
function reallyEmptyTrash() { data.trash = []; closeModal(); saveData(); render(); }

function askResetAll() {
  showModal('সবকিছু রিসেট করবেন?', 'সব সাবজেক্ট, প্রশ্ন, ছবি, ভুল, সেটিংস — সব মুছে যাবে। আগে ব্যাকআপ নিয়েছেন?', 'হ্যাঁ, সব মুছুন', 'reallyResetAll()', true);
}
async function reallyResetAll() {
  try { await mediaClearAll(); } catch (e) {}
  data = defaultData();
  memoryFallback = data;
  closeModal(); saveData(); applyFont(); goto('home');
}

/* ========== INIT ========== */
(async function init() {
  try { await initMediaBackend(); await requestPersist(); } catch (e) {}
  render();
})();
</script>
