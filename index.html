<style>

  .media-thumb .pdf-badge { display: flex; align-items: center; justify-content: center;

  .file-input-hidden { display: none; }
</style>

<body>
<div id="app"></div>

<script>
/* =====================================================
   CONSTANTS
===================================================== */
const STORAGE_KEY = 'examStudyAppData_v2';
const TRASH_TTL_DAYS = 30;
const LETTERS = ['ক', 'খ', 'গ', 'ঘ'];
const MAX_FINAL_TEST = 40;

/* =====================================================
   INDEXEDDB FOR MEDIA
===================================================== */
let idbPromise = null;
function openIDB() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open('examPrepMediaDB', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('media')) {
          const store = db.createObjectStore('media', { keyPath: 'id' });
          store.createIndex('chapterId', 'chapterId', { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  });
  return idbPromise;
}

async function idbSaveMedia(item) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetMedia(id) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readonly');
    const req = tx.objectStore('media').get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbDeleteMedia(id) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetByChapter(chapterId) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readonly');
    const idx = tx.objectStore('media').index('chapterId');
    const req = idx.getAll(chapterId);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function idbGetAll() {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readonly');
    const req = tx.objectStore('media').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function idbClearAll() {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function base64ToBlob(dataUrl) {
  return fetch(dataUrl).then(r => r.blob());
}

/* =====================================================
   MAIN DATA (localStorage)
===================================================== */
let memoryFallback = null;

function defaultData() {
  return {
    subjects: [
      { id: 'subj-1', name: 'বিষয় ১', chapters: [] },
      { id: 'subj-2', name: 'বিষয় ২', chapters: [] },
      { id: 'subj-3', name: 'বিষয় ৩', chapters: [] },
      { id: 'subj-4', name: 'বিষয় ৪', chapters: [] }
    ],
    wrongQuestions: [],
    trash: [],
    mediaMeta: []  // [{ id, chapterId, type, name, createdAt }]
  };
}

function loadData() {
  if (memoryFallback) return memoryFallback;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    memoryFallback = raw ? JSON.parse(raw) : defaultData();
    if (!memoryFallback.wrongQuestions) memoryFallback.wrongQuestions = [];
    if (!memoryFallback.trash) memoryFallback.trash = [];
    if (!memoryFallback.mediaMeta) memoryFallback.mediaMeta = [];
    purgeOldTrash();
  } catch (e) { memoryFallback = defaultData(); }
  return memoryFallback;
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(memoryFallback));
  } catch (e) {
    alert('⚠️ ডেটা সেভ করা যাচ্ছে না। স্টোরেজ প্রায় ভরে গেছে।\n\nএকটি ব্যাকআপ ডাউনলোড করে কিছু পুরনো প্রশ্ন মুছে ফেলুন।');
  }
}

function purgeOldTrash() {
  const now = Date.now();
  const ttl = TRASH_TTL_DAYS * 86400000;
  memoryFallback.trash = memoryFallback.trash.filter(item => (now - item.deletedAt) < ttl);
  saveData();
}

/* =====================================================
   HELPERS
===================================================== */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function findSubject(id) { return data.subjects.find(s => s.id === id); }
function findChapter(subj, id) { return subj ? subj.chapters.find(c => c.id === id) : null; }
function allQuestionsOfSubject(subj) {
  const qs = [];
  subj.chapters.forEach(ch => ch.questions.forEach(q => qs.push({ q, chapterId: ch.id, chapterName: ch.name })));
  return qs;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(str) {
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' });
}
function getWrongForChapter(chapId) {
  return data.wrongQuestions.filter(w => w.chapterId === chapId);
}

/* =====================================================
   STATE
===================================================== */
let data = loadData();
const state = {
  screen: 'home',
  subjectId: null,
  chapterId: null,
  mode: null,
  quizQuestions: [],
  quizIndex: 0,
  quizScore: 0,
  quizAnswered: null,
  quizWrongIds: [],
  addingSubject: false,
  addingChapter: false,
  noteError: null,
  bulkPreview: null,
  bulkError: null,
  modal: null,
  mediaList: [],
  mediaViewer: null,
  wrongChapterId: null,
  mediaLoading: false
};

function goto(screen, opts) {
  state.screen = screen;
  if (opts) Object.assign(state, opts);
  render();
  window.scrollTo(0, 0);
}

/* =====================================================
   RENDER ROOT
===================================================== */
function render() {
  const app = document.getElementById('app');
  const fn = {
    home: renderHome,
    subject: renderSubject,
    chapter: renderChapter,
    notes: renderNotes,
    bulkImport: renderBulkImport,
    media: renderMedia,
    chapterWrong: renderChapterWrong,
    quiz: renderQuiz,
    result: renderResult,
    trash: renderTrash,
    backup: renderBackup
  }[state.screen];
  app.innerHTML = fn() + (state.modal ? renderModal() : '') + (state.mediaViewer ? renderMediaViewer() : '');
  // Rebind viewers
  if (state.mediaViewer) bindViewer();
}

function topbar(title, backScreen) {
  return `<div class="topbar">
    <button class="back-btn" onclick="goto('${backScreen}')">←</button>
    <h1 class="page-title">${title}</h1>
  </div>`;
}

/* =====================================================
   HOME
===================================================== */
function renderHome() {
  let html = `<div class="hero">

function saveNewQuestion() {
  const text = document.getElementById('qtext').value.trim();
  const opts = [0, 1, 2, 3].map(i => document.getElementById('opt' + i).value.trim());
  if (!text || opts.some(o => !o)) {
    state.noteError = 'অনুগ্রহ করে প্রশ্ন এবং চারটি অপশনই পূরণ করুন।';
    render(); return;
  }
  state.noteError = null;
  const correct = parseInt(document.querySelector('input[name=correctOpt]:checked').value, 10);
  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  c.questions.push({ id: uid(), text, options: opts, correct });
  saveData(); render();
}

/* =====================================================
   BULK IMPORT
===================================================== */
function parseBulkText(text) {
  const blocks = text.trim().split(/\n\s*\n/);
  const questions = [];
  const errors = [];

  blocks.forEach((block, bi) => {
    const lines = block.split('\n').map(l => l.trim()).filter(l => l);
    if (lines.length === 0) return;

    const optRegex = /^([কখগঘ]|[aAbBcCdD])\s*[\).\]:।]\s*/;
    const optLines = lines.filter(l => optRegex.test(l));

    if (optLines.length !== 4) {
      errors.push(`ব্লক ${bi + 1}: ৪টি অপশন পাওয়া যায়নি (${optLines.length}টি পাওয়া গেছে)`);
      return;
    }

    const qLines = lines.filter(l =>
      !optLines.includes(l) &&
      !/^উত্তর\s*[:：]/i.test(l) &&
      !/^answer\s*[:：]/i.test(l)
    );
    if (qLines.length === 0) {
      errors.push(`ব্লক ${bi + 1}: প্রশ্নের টেক্সট পাওয়া যায়নি`);
      return;
    }
    const qText = qLines.join(' ').replace(/^প্রশ্ন\s*[:：]?\s*/, '').trim();

    const options = optLines.map(l => l.replace(optRegex, '').trim());
    let correct = -1;

    optLines.forEach((l, i) => {
      if (l.includes('*')) {
        if (correct === -1) correct = i;
        options[i] = options[i].replace(/\*/g, '').trim();
      }
    });

    if (correct === -1) {
      const answerLine = lines.find(l => /^(উত্তর|answer)\s*[:：]/i.test(l));
      if (answerLine) {
        const ans = answerLine.replace(/^(উত্তর|answer)\s*[:：]\s*/i, '').trim();
        const letterMap = { 'ক': 0, 'খ': 1, 'গ': 2, 'ঘ': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3, 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
        const letter = ans.charAt(0);
        if (letterMap[letter] !== undefined) correct = letterMap[letter];
        else if (/^[1-4]/.test(ans)) correct = parseInt(ans) - 1;
        else {
          const idx = options.findIndex(o => o.toLowerCase() === ans.toLowerCase());
          if (idx !== -1) correct = idx;
        }
      }
    }

    if (correct === -1 || correct > 3) {
      errors.push(`ব্লক ${bi + 1}: সঠিক উত্তর চিহ্নিত করা যায়নি`);
      return;
    }

    questions.push({ id: uid(), text: qText, options, correct });
  });

  return { questions, errors };
}

  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  if (!c) { goto('notes'); return ''; }

  let html = topbar('বাল্ক ইমপোর্ট', 'notes');

  html += `<div class="info-banner">
    <b>📌 ফরম্যাট:</b> প্রতিটি প্রশ্নের পরে একটি খালি লাইন দিন। সঠিক উত্তরের শেষে <b>*</b> চিহ্ন দিন।
    <div class="format-box">বাংলাদেশের রাজধানী কী?
ক) চট্টগ্রাম
খ) ঢাকা *
গ) খুলনা
ঘ) রাজশাহী

স্বাধীনতার বছর?
ক) ১৯৭০
খ) ১৯৭১ *
গ) ১৯৭২
ঘ) ১৯৬৯</div>
  </div>`;

  if (state.bulkError) html += `<div class="note-banner">${state.bulkError}</div>`;

  html += `<textarea id="bulkText" rows="12" placeholder="এখানে সব প্রশ্ন একসাথে পেস্ট করুন..."></textarea>`;
  html += `<button class="btn btn-primary" onclick="previewBulk()">👁️ প্রিভিউ দেখুন</button>`;
  html += `<button class="btn btn-quiet" onclick="state.bulkPreview=null;state.bulkError=null;goto('notes')">বাতিল</button>`;

  if (state.bulkPreview && state.bulkPreview.questions.length > 0) {
    html += `<div class="section-label">প্রিভিউ (${state.bulkPreview.questions.length}টি সফলভাবে পার্স হয়েছে)</div>`;

    if (state.bulkPreview.errors.length > 0) {
      html += `<div class="note-banner">⚠️ ${state.bulkPreview.errors.length}টি ব্লকে সমস্যা:<br>${state.bulkPreview.errors.map(e => '• ' + e).join('<br>')}</div>`;
    }

    html += `<button class="btn btn-success" onclick="confirmBulkImport()">✅ ${state.bulkPreview.questions.length}টি প্রশ্ন যোগ করুন</button>`;

    state.bulkPreview.questions.forEach((q, i) => {
      html += `<div class="qa-item">
        <div class="qa-q">${i + 1}. ${escapeHtml(q.text)}</div>`;
      q.options.forEach((opt, oi) => {
        html += `<div class="qa-opt ${oi === q.correct ? 'is-correct' : ''}">
          <span class="letter">${LETTERS[oi]}</span>
          <span>${escapeHtml(opt)}${oi === q.correct ? ' ✓' : ''}</span>
        </div>`;
      });
      html += `</div>`;
    });
  }

  return html;
}

function previewBulk() {
  const text = document.getElementById('bulkText').value;
  if (!text.trim()) { state.bulkError = 'প্রথমে কিছু পেস্ট করুন।'; render(); return; }
  const result = parseBulkText(text);
  state.bulkPreview = result;
  state.bulkError = result.questions.length === 0 ? '❌ কোনো প্রশ্ন পার্স করা যায়নি। ফরম্যাট ঠিকভাবে অনুসরণ করুন।' : null;
  render();
  if (result.questions.length > 0) window.scrollTo(0, 300);
}

function confirmBulkImport() {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  const count = state.bulkPreview.questions.length;
  state.bulkPreview.questions.forEach(q => c.questions.push(q));
  saveData();
  state.bulkPreview = null;
  state.bulkError = null;
  alert(`✅ ${count}টি প্রশ্ন সফলভাবে যোগ হয়েছে!`);
  goto('notes');
}

async function openMediaScreen() {
  state.mediaLoading = true;
  goto('media');
  try {
    const list = await idbGetByChapter(state.chapterId);
    // sort newest first
    list.sort((a, b) => b.createdAt - a.createdAt);
    state.mediaList = list;
  } catch (e) {
    state.mediaList = [];
    alert('⚠️ ছবি লোড করতে সমস্যা হয়েছে। আপনার ব্রাউজার IndexedDB সাপোর্ট করে কিনা দেখুন।');

  state.mediaLoading = false;
  render();
}

async function handleMediaUpload(event, type) {
  const file = event.target.files[0];
  if (!file) return;

  // Size check
  const MAX_SIZE = 8 * 1024 * 1024; // 8 MB
  if (file.size > MAX_SIZE) {
    if (!confirm(`ফাইলটি ${(file.size / 1024 / 1024).toFixed(1)} MB। বড় ফাইল স্টোরেজ ভরে ফেলতে পারে।\n\nতবুও যোগ করতে চান?`)) {
      event.target.value = '';
      return;
    }
  }

  try {
    let blob = file;
    let thumbUrl = '';

    if (type === 'image') {
      // Compress image
      try {
        blob = await compressImage(file, 1200, 0.82);
      } catch (e) { /* use original */ }
    }

    const id = uid();
    const item = {
      id,
      chapterId: state.chapterId,
      type,
      name: file.name || (type === 'image' ? 'ছবি' : 'PDF'),
      blob,
      createdAt: Date.now()
    };
    await idbSaveMedia(item);

    // Save metadata in main data
    data.mediaMeta.push({ id, chapterId: state.chapterId, type, name: item.name, createdAt: item.createdAt });
    saveData();

    event.target.value = '';
    await openMediaScreen();
  } catch (e) {
    alert('❌ ফাইল যোগ করা যায়নি: ' + e.message);
    event.target.value = '';
  }
}

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxWidth) {
        height = Math.round(height * maxWidth / width);
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(b => {
        if (b) resolve(b);
        else reject(new Error('ছবি কমপ্রেস করা যায়নি'));
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ছবি পড়া যায়নি')); };
    img.src = url;
  });
}

/* =====================================================
   QUIZ ENGINE
===================================================== */
function startChapterPractice() {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  state.quizQuestions = shuffle(c.questions);
  state.quizIndex = 0; state.quizScore = 0; state.quizAnswered = null; state.quizWrongIds = [];
  state.mode = 'chapter';
  goto('quiz');
}

function startFinalTest() {
  const s = findSubject(state.subjectId);
  const all = allQuestionsOfSubject(s).map(x => x.q);
  state.quizQuestions = shuffle(all).slice(0, Math.min(MAX_FINAL_TEST, all.length));
  state.quizIndex = 0; state.quizScore = 0; state.quizAnswered = null; state.quizWrongIds = [];
  state.mode = 'final';
  goto('quiz');
}

function startChapterWrongPractice() {
  const wrongs = getWrongForChapter(state.chapterId);
  if (wrongs.length === 0) return;
  state.quizQuestions = shuffle(wrongs.map(w => w.question));
  state.quizIndex = 0; state.quizScore = 0; state.quizAnswered = null; state.quizWrongIds = [];
  state.mode = 'chapterWrong';
  goto('quiz');
}

function renderQuiz() {
  const qs = state.quizQuestions;
  if (!qs || qs.length === 0) { goto('home'); return ''; }
  const idx = state.quizIndex;
  const q = qs[idx];
  const pct = Math.round((idx / qs.length) * 100);

  const titleMap = { final: 'ফাইনাল মক টেস্ট', chapterWrong: 'ভুল প্রশ্ন প্র্যাকটিস', chapter: 'MCQ প্র্যাকটিস' };
  const backMap = { final: 'subject', chapterWrong: 'chapterWrong', chapter: 'chapter' };

  let html = topbar(titleMap[state.mode] || 'প্রশ্ন', backMap[state.mode] || 'chapter');

  html += `<div class="q-progress">
    <span>প্রশ্ন ${idx + 1} / ${qs.length}</span>
    <span class="score-pill">স্কোর ${state.quizScore}</span>
  </div>`;
  html += `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;

  html += `<div class="q-text">${escapeHtml(q.text)}</div>`;

  q.options.forEach((opt, oi) => {
    let cls = 'opt-row';
    if (state.quizAnswered !== null) {
      if (oi === q.correct) cls += ' correct';
      else if (oi === state.quizAnswered) cls += ' wrong';
    }
    html += `<button class="${cls}" ${state.quizAnswered !== null ? 'disabled' : `onclick="answerQuiz(${oi})"`}>
      <span class="opt-bubble">${LETTERS[oi]}</span>
      <span>${escapeHtml(opt)}</span>
    </button>`;
  });

  if (state.quizAnswered !== null) {
    html += `<button class="btn btn-primary" style="margin-top:16px;" onclick="nextQuiz()">
      ${idx + 1 < qs.length ? 'পরবর্তী প্রশ্ন →' : 'ফলাফল দেখুন'}
    </button>`;
  }
  return html;
}

function answerQuiz(oi) {
  if (state.quizAnswered !== null) return;
  state.quizAnswered = oi;
  const q = state.quizQuestions[state.quizIndex];

  if (oi === q.correct) {
    state.quizScore++;
    if (state.mode === 'chapterWrong') {
      data.wrongQuestions = data.wrongQuestions.filter(w => w.question.id !== q.id);
      saveData();
    }
  } else {
    state.quizWrongIds.push(q.id);
    addToWrongList(q);
  }
  render();
}

function addToWrongList(q) {
  let subjId = '', subjName = '', chapId = '', chapName = '';
  for (const s of data.subjects) {
    for (const c of s.chapters) {
      if (c.questions.some(cq => cq.id === q.id)) {
        subjId = s.id; subjName = s.name;
        chapId = c.id; chapName = c.name;
        break;
      }
    }
    if (subjId) break;
  }
  const existing = data.wrongQuestions.find(w => w.question.id === q.id);
  if (existing) {
    existing.wrongCount = (existing.wrongCount || 1) + 1;
    existing.lastWrong = Date.now();
    if (!existing.chapterId) { existing.chapterId = chapId; existing.chapterName = chapName; }
    if (!existing.subjectId) { existing.subjectId = subjId; existing.subjectName = subjName; }
  } else {
    data.wrongQuestions.push({
      question: q,
      subjectId: subjId, subjectName: subjName,
      chapterId: chapId, chapterName: chapName,
      wrongCount: 1,
      lastWrong: Date.now()
    });
  }
  saveData();
}

function nextQuiz() {
  state.quizIndex++;
  state.quizAnswered = null;
  if (state.quizIndex >= state.quizQuestions.length) goto('result');
  else render();
}

  html += `<button class="btn btn-quiet" onclick="goto('home')">🏠 হোম</button>`;
  return html;
}

function retryQuiz() {
  if (state.mode === 'final') startFinalTest();
  else if (state.mode === 'chapterWrong') startChapterWrongPractice();
  else startChapterPractice();

  if (data.trash.length === 0) {

    return html;
  }

  html += `<button class="btn btn-danger" style="margin-bottom:16px;" onclick="askEmptyTrash()">সব স্থায়ীভাবে মুছে ফেলুন</button>`;

  data.trash.forEach((t) => {
    const daysLeft = Math.ceil((TRASH_TTL_DAYS * 86400000 - (Date.now() - t.deletedAt)) / 86400000);
    const typeLabel = t.type === 'subject' ? 'সাবজেক্ট' : t.type === 'chapter' ? 'অধ্যায়' : 'প্রশ্ন';
    let name = t.type === 'subject' ? t.data.name : t.type === 'chapter' ? t.data.name : t.data.text;
    if (name.length > 50) name = name.slice(0, 50) + '...';

    html += `<div class="trash-item">
      <div class="trash-info">
        <div class="trash-name">${escapeHtml(name)}</div>
        <div class="trash-meta">${typeLabel} · ডিলিট হয়েছে ${fmtDate(t.deletedAt)} · ${daysLeft} দিন বাকি</div>
      </div>
      <div class="trash-actions">
        <button class="icon-btn restore" onclick="restoreFromTrash('${t.id}')">↩️</button>
        <button class="icon-btn kill" onclick="killTrashItem('${t.id}')">✕</button>
      </div>
    </div>`;
  });

  return html;
}

function restoreFromTrash(tid) {
  const item = data.trash.find(t => t.id === tid);
  if (!item) return;
  if (item.type === 'subject') {
    data.subjects.push(item.data);
  } else if (item.type === 'chapter') {
    const subj = findSubject(item.parentId);
    if (!subj) { alert('মূল সাবজেক্টটি পাওয়া যাচ্ছে না।'); return; }
    subj.chapters.push(item.data);
  } else if (item.type === 'question') {
    const subj = findSubject(item.subjectId);
    const chap = findChapter(subj, item.chapterId);
    if (!chap) { alert('মূল অধ্যায়টি পাওয়া যাচ্ছে না।'); return; }
    chap.questions.push(item.data);
  }
  data.trash = data.trash.filter(t => t.id !== tid);
  saveData(); render();
}

function killTrashItem(tid) {
  data.trash = data.trash.filter(t => t.id !== tid);
  saveData(); render();
}

  html += `<div class="row-sub" style="margin:-4px 4px 20px;">⚠️ রিস্টোর করলে বর্তমান সব ডেটা প্রতিস্থাপিত হবে।</div>`;

  html += `<div class="section-label">স্টোরেজ তথ্য</div>`;
  html += `<div class="card"><div class="row-sub">📷 সংরক্ষিত ছবি/PDF: <b>${data.mediaMeta.length}</b> টি</div></div>`;

  html += `<div class="section-label">বিপজ্জনক এলাকা</div>`;
  html += `<button class="btn btn-danger" onclick="askResetAll()">🔄 সবকিছু রিসেট করুন</button>`;
  html += `<div class="row-sub" style="margin:-4px 4px;">এটি সব প্রশ্ন, ছবি, নোট, রেকর্ড মুছে ফেলবে।</div>`;

  return html;
}

async function exportBackup() {
  try {
    alert('⏳ ব্যাকআপ তৈরি হচ্ছে... ছবি থাকলে কিছু সময় লাগতে পারে।');
    const allMedia = await idbGetAll();
    const mediaData = [];
    for (const m of allMedia) {
      if (!m.blob) continue;
      const base64 = await blobToBase64(m.blob);
      mediaData.push({
        id: m.id,
        chapterId: m.chapterId,
        type: m.type,
        name: m.name,
        createdAt: m.createdAt,
        data: base64
      });
    }
    const backup = {
      subjects: data.subjects,
      wrongQuestions: data.wrongQuestions,
      trash: data.trash,
      mediaMeta: data.mediaMeta,
      media: mediaData,
      exportedAt: Date.now()
    };
    const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `exam-prep-backup-${ts}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('❌ ব্যাকআপ তৈরি করা যায়নি: ' + e.message);
  }
}

function importBackup() {
  const fileInput = document.getElementById('importFile');
  const file = fileInput.files[0];
  if (!file) { alert('প্রথমে একটি ব্যাকআপ ফাইল নির্বাচন করুন।'); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.subjects || !Array.isArray(parsed.subjects)) throw new Error('ভুল ফাইল');
      if (!confirm('বর্তমান সব ডেটা প্রতিস্থাপিত হবে। নিশ্চিত?')) return;

      alert('⏳ রিস্টোর হচ্ছে... ছবি থাকলে কিছু সময় লাগবে।');

      // Save media to IndexedDB
      await idbClearAll();
      if (parsed.media && Array.isArray(parsed.media)) {
        for (const m of parsed.media) {
          if (!m.data) continue;
          const blob = await base64ToBlob(m.data);
          await idbSaveMedia({
            id: m.id,
            chapterId: m.chapterId,
            type: m.type,
            name: m.name,
            blob,
            createdAt: m.createdAt || Date.now()
          });
        }
      }

      data = {
        subjects: parsed.subjects,
        wrongQuestions: parsed.wrongQuestions || [],
        trash: parsed.trash || [],
        mediaMeta: parsed.mediaMeta || (parsed.media ? parsed.media.map(m => ({ id: m.id, chapterId: m.chapterId, type: m.type, name: m.name, createdAt: m.createdAt })) : [])
      };
      memoryFallback = data;
      saveData();
      alert('✅ সফলভাবে রিস্টোর হয়েছে।');
      goto('home');
    } catch (err) {
      alert('❌ রিস্টোর করা যায়নি: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* =====================================================
   MODALS
===================================================== */
function renderModal() {
  const m = state.modal;
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>${m.title}</h3>
      <p>${m.body}</p>
      <button class="btn ${m.danger ? 'btn-danger' : 'btn-primary'}" onclick="${m.onOk}">${m.okText}</button>
      <button class="btn btn-quiet" onclick="closeModal()">বাতিল</button>
    </div>
  </div>`;
}
function closeModal() { state.modal = null; render(); }
function showModal(title, body, okText, onOk, danger) {
  state.modal = { title, body, okText, onOk, danger };
  render();
}

function askDeleteSubject(id) {
  const s = findSubject(id);
  showModal('সাবজেক্ট মুছবেন?',
    `"${escapeHtml(s.name)}" এবং এর সব অধ্যায়, প্রশ্ন, ছবি ৩০ দিনের জন্য রিসাইকেল বিনে যাবে।`,
    'মুছে ফেলুন', `reallyDeleteSubject('${id}')`, true);
}
async function reallyDeleteSubject(id) {
  const s = findSubject(id);
  // Delete all media of this subject's chapters
  for (const c of s.chapters) {
    const mediaList = data.mediaMeta.filter(m => m.chapterId === c.id);
    for (const m of mediaList) {
      try { await idbDeleteMedia(m.id); } catch (e) {}
    }
  }
  data.mediaMeta = data.mediaMeta.filter(m => !s.chapters.some(c => c.id === m.chapterId));
  data.trash.push({ id: uid(), type: 'subject', data: s, deletedAt: Date.now() });
  data.subjects = data.subjects.filter(x => x.id !== id);
  closeModal(); saveData(); render();
}

function askDeleteChapter(id) {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, id);
  showModal('অধ্যায় মুছবেন?',
    `"${escapeHtml(c.name)}" এবং এর ${c.questions.length}টি প্রশ্ন ও ছবি ৩০ দিনের জন্য রিসাইকেল বিনে যাবে।`,
    'মুছে ফেলুন', `reallyDeleteChapter('${id}')`, true);
}
async function reallyDeleteChapter(id) {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, id);
  // Delete media
  const mediaList = data.mediaMeta.filter(m => m.chapterId === id);
  for (const m of mediaList) {
    try { await idbDeleteMedia(m.id); } catch (e) {}
  }
  data.mediaMeta = data.mediaMeta.filter(m => m.chapterId !== id);
  data.trash.push({ id: uid(), type: 'chapter', data: c, parentId: s.id, deletedAt: Date.now() });
  s.chapters = s.chapters.filter(x => x.id !== id);
  closeModal(); saveData(); render();
}

function askDeleteQuestion(qid) {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  const q = c.questions.find(x => x.id === qid);
  showModal('প্রশ্ন মুছবেন?',
    `"${escapeHtml(q.text.slice(0, 60))}..." ৩০ দিনের জন্য রিসাইকেল বিনে যাবে।`,
    'মুছে ফেলুন', `reallyDeleteQuestion('${qid}')`, true);
}
function reallyDeleteQuestion(qid) {
  const s = findSubject(state.subjectId);
  const c = findChapter(s, state.chapterId);
  const q = c.questions.find(x => x.id === qid);
  data.trash.push({ id: uid(), type: 'question', data: q, subjectId: s.id, chapterId: c.id, deletedAt: Date.now() });
  c.questions = c.questions.filter(x => x.id !== qid);
  // Also remove from wrongQuestions if present
  data.wrongQuestions = data.wrongQuestions.filter(w => w.question.id !== qid);
  closeModal(); saveData(); render();
}

function askEmptyTrash() {
  showModal('বিন খালি করবেন?',
    'রিসাইকেল বিনের সবকিছু স্থায়ীভাবে মুছে যাবে। আর ফেরত আনা যাবে না।',
    'স্থায়ীভাবে মুছুন', 'reallyEmptyTrash()', true);
}
function reallyEmptyTrash() {
  data.trash = [];
  closeModal(); saveData(); render();
}

function askResetAll() {
  showModal('সবকিছু রিসেট করবেন?',
    'সব সাবজেক্ট, অধ্যায়, প্রশ্ন, ছবি, ভুল প্রশ্নের তালিকা — সব মুছে যাবে। আগে ব্যাকআপ নিয়েছেন?',
    'হ্যাঁ, সব মুছে ফেলুন', 'reallyResetAll()', true);
}
async function reallyResetAll() {
  try { await idbClearAll(); } catch (e) {}
  data = defaultData();
  memoryFallback = data;
  closeModal(); saveData(); goto('home');
}

/* =====================================================
   INIT
===================================================== */
render();
</script>
